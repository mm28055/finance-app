name: Weekly Tijori Calls

# Calls that never reach the exchange: talks at broker conferences, investor days and other
# special calls, which Tijori records and transcribes itself (the nightly NSE job only sees what
# companies file). scripts/smart-sync.ts --special-only checks every company's Tijori list for its
# latest two quarters and stores, analyses and indexes the special calls the app does not yet hold
# ("Special call" slots). Results calls are left to the nightly NSE job, which stores the company's
# own filed transcript; Tijori's are machine-made from the audio.
on:
  schedule:
    # Sunday 6:00am IST (Sunday 00:30 UTC), clear of the nightly jobs and the 3am backup.
    - cron: '30 0 * * 0'
  workflow_dispatch:          # Allow a manual run from the GitHub UI

concurrency:
  group: weekly-tijori-calls
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tijori:
    name: Pull calls from Tijori
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync calls from Tijori
        run: npx tsx scripts/smart-sync.ts --special-only --concurrency=4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
