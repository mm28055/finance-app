name: Daily Filings Digest

on:
  schedule:
    - cron: '30 14 * * 1-6'  # 8:00pm IST, Monday to Saturday (after the day's filings)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

# Never two at once: a late scheduled run and a manual one wait for each other.
concurrency:
  group: daily-filings-digest
  cancel-in-progress: false

# The job commits lib/filings/filings.json back to the repository, which redeploys the site.
permissions:
  contents: write

jobs:
  filings:
    name: Summarise material filings
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read and summarise the last two days of filings
        run: npx tsx scripts/sync-filings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the updated digest
        run: |
          if git diff --quiet lib/filings/filings.json; then
            echo "No new material filings."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/filings/filings.json
          git commit -m "Update material filings digest"
          # Other commits may have landed during the run; take them first so the push is not refused.
          git pull --rebase
          git push

      # Market and policy news from the business papers, and the reason for any share that moved
      # sharply. Runs after the digest (it reads the day's filings) and never fails the job.
      - name: Market news and why shares moved
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 45
        run: npx tsx scripts/sync-market-news.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      # Result dates (the exchange's board-meetings calendar) and earnings-call dates (the companies'
      # call notices). Never fails the job.
      - name: Result and earnings-call dates
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        run: npx tsx scripts/sync-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the news
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if git diff --quiet lib/news lib/events; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/news/news.json lib/news/seen.json lib/events/events.json lib/events/seen.json
          git commit -m "Update market news, price moves and the results calendar"
          git pull --rebase
          git push

      # Call transcripts filed on NSE (and, for companies NSE does not list, on
      # Screener) over the last three days: results calls go to their quarter,
      # AGMs and special calls to their own slots, each analysed. Runs after the
      # digest is committed and never fails the job, so a problem here cannot
      # hold back the filings.
      - name: Fetch call transcripts from the exchange
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 120
        run: npx tsx scripts/sync-exchange-transcripts.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Results out in the last five days (dates from the calendar above): the quarter's figures from
      # Screener's quarterly table, a short view on them, and what the call added once it has been
      # analysed (the step above). Runs last so the call notes can be added the same night; never fails the job.
      - name: Results figures and the overnight view
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        run: npx tsx scripts/sync-results.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the results
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if git diff --quiet lib/results; then
            echo "No results changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/results/results.json
          git commit -m "Update quarter results and the overnight view"
          git pull --rebase
          git push

      # Changes in the notes' calls (own / follow / wait / pass / avoid) since last night, with the
      # day's price: shown in the Filings panel's "Call changes" tab. Never fails the job.
      - name: Record call changes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          npx tsx scripts/track-call-changes.ts
          if git diff --quiet lib/calls-log; then
            echo "No call changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/calls-log/changes.json lib/calls-log/snapshot.json
          git commit -m "Record call changes"
          git pull --rebase
          git push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
