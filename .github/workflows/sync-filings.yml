name: Daily Filings Digest

on:
  schedule:
    - cron: '30 14 * * 1-6'  # 8:00pm IST, Monday to Saturday (after the day's filings)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

# Never two at once: a late scheduled run and a manual one wait for each other.
concurrency:
  group: daily-filings-digest
  cancel-in-progress: false

# The job commits lib/filings/filings.json back to the repository, which redeploys the site.
permissions:
  contents: write

jobs:
  filings:
    name: Summarise material filings
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's ceiling for one job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Call transcripts filed on NSE (and, for companies NSE does not list, on Screener) over the
      # last seven days: results calls go to their quarter, AGMs and special calls to their own slots.
      # The transcripts are stored now and their analyses sent to Gemini's batch mode (half price),
      # which the 7am job (collect-call-batches.yml) saves; this step first saves the profile
      # refreshes the 7am job sent, and any call batch Google had not finished by the morning.
      # Runs FIRST: from 3 to 6 Nov 2026 the filings digest took over 3 hours, the job hit its time
      # cap with this step near the end, and about 60 transcripts were never stored. The seven-day
      # window lets a night that is cut short be made up the next night. Never fails the job.
      - name: Fetch call transcripts from the exchange
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        run: |
          npx tsx scripts/collect-call-batches.ts
          npx tsx scripts/sync-exchange-transcripts.ts --batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Read and summarise the last two days of filings
        run: npx tsx scripts/sync-filings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the updated digest
        run: |
          if git diff --quiet lib/filings/filings.json; then
            echo "No new material filings."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/filings/filings.json
          git commit -m "Update material filings digest"
          # Other commits may have landed during the run; take them first so the push is not refused.
          git pull --rebase
          git push

      # Market and policy news from the business papers, and the reason for any share that moved
      # sharply. Runs after the digest (it reads the day's filings) and never fails the job.
      - name: Market news and why shares moved
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 45
        run: npx tsx scripts/sync-market-news.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      # Result dates (the exchange's board-meetings calendar) and earnings-call dates (the companies'
      # call notices). Never fails the job.
      - name: Result and earnings-call dates
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        run: npx tsx scripts/sync-events.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the news
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if git diff --quiet lib/news lib/events; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/news/news.json lib/news/seen.json lib/events/events.json lib/events/seen.json
          git commit -m "Update market news, price moves and the results calendar"
          git pull --rebase
          git push

      # The day's results figures and view, before the slow transcript step: on a busy night
      # (28 Oct, 53 results) the job hit its time cap during transcripts and no results were saved.
      # The second pass after transcripts only adds call notes.
      - name: Results figures and the overnight view (first pass)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        run: |
          npx tsx scripts/sync-results.ts
          if git diff --quiet lib/results; then
            echo "No results changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/results/results.json
          git commit -m "Update quarter results and the overnight view"
          git pull --rebase
          git push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      # Results out in the last five days (dates from the calendar above): the quarter's figures from
      # Screener's quarterly table, a short view on them, and what the call added once it has been
      # analysed (the transcript step at the top). Runs last so the call notes can be added; never fails the job.
      - name: Results figures and the overnight view
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        run: npx tsx scripts/sync-results.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      - name: Commit the results
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if git diff --quiet lib/results; then
            echo "No results changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/results/results.json
          git commit -m "Update quarter results and the overnight view"
          git pull --rebase
          git push

      # A three-way read (positive / neutral / concerning) on each new AGM and special call, and one
      # line on what changed since the last results call; shown only in the Filings panel. Never fails the job.
      - name: Read AGMs and special calls
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          npx tsx scripts/sync-call-reads.ts
          if git diff --quiet lib/calls-read; then
            echo "No new reads."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/calls-read/reads.json
          git commit -m "Read new AGMs and special calls"
          git pull --rebase
          git push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GOOGLE_AI_KEYS: ${{ secrets.GOOGLE_AI_KEYS }}

      # Changes in the notes' calls (own / follow / wait / pass / avoid) since last night, with the
      # day's price: shown in the Filings panel's "Call changes" tab. Never fails the job.
      - name: Record call changes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          npx tsx scripts/track-call-changes.ts
          if git diff --quiet lib/calls-log; then
            echo "No call changes."
            exit 0
          fi
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add lib/calls-log/changes.json lib/calls-log/snapshot.json
          git commit -m "Record call changes"
          git pull --rebase
          git push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
