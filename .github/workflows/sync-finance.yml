name: Daily Finance Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 4:00pm IST (10:30 UTC), weekdays only
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  sync:
    name: Sync Finance Data
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run finance sync
        run: node scripts/sync-finance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
