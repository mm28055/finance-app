name: Daily Finance Sync

on:
  schedule:
    # 6:00pm IST (12:30 UTC), weekdays: after NSE publishes the day's closing-price
    # files (bhavcopy ~4:30pm, market-cap file ~5pm). Earlier, the sync would
    # fall back to the previous day's prices.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:          # Allow manual trigger from GitHub UI

# Never two at once: a late scheduled run and a manual one wait for each other.
concurrency:
  group: daily-finance-sync
  cancel-in-progress: false

# The job commits lib/corporate-actions/*.json (and lib/screener-overrides.json
# when an ISIN changes) back to the repository.
permissions:
  contents: write

jobs:
  sync:
    name: Sync Finance Data
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Renames, symbol/ISIN changes, splits, bonuses and demergers from NSE's
      # own files, so the price sync below still finds every company. Never
      # fails the job: a problem here must not hold back the prices.
      - name: Apply corporate actions
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/sync-corporate-actions.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Price, market cap, P/E, P/B and 52-week range from NSE's end-of-day
      # files; each company's Screener page once a week (book value, ROCE,
      # sales, shareholding), and daily only for the few BSE-only companies.
      - name: Run finance sync
        run: node scripts/sync-finance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Calls whose price has drifted far since the note (an own now stretched, a
      # wait/pass now fitting) go to needs-attention.json for the next session.
      - name: Check calls against today's prices
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx tsx scripts/check-call-drift.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Numeric checkpoints from the notes whose quarter's results are now filed.
      - name: Settle checkpoints
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx tsx scripts/check-checkpoints.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Commit the corporate-actions record
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain lib/corporate-actions/*.json lib/screener-overrides.json lib/checkpoints/checkpoints.json)" ]; then
            echo "No corporate-action changes."
            exit 0
          fi
          git config user.name "corporate-actions-bot"
          git config user.email "corporate-actions-bot@users.noreply.github.com"
          git add lib/corporate-actions/*.json lib/screener-overrides.json lib/checkpoints/checkpoints.json
          git commit -m "Record corporate actions applied by the daily sync"
          git pull --rebase
          git push
