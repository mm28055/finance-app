name: Daily Finance Sync

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 4:00pm IST (10:30 UTC), weekdays only
  workflow_dispatch:          # Allow manual trigger from GitHub UI

# The job commits lib/corporate-actions/*.json (and lib/screener-overrides.json
# when an ISIN changes) back to the repository.
permissions:
  contents: write

jobs:
  sync:
    name: Sync Finance Data
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Renames, symbol/ISIN changes, splits, bonuses and demergers from NSE's
      # own files, so the price sync below still finds every company. Never
      # fails the job: a problem here must not hold back the prices.
      - name: Apply corporate actions
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/sync-corporate-actions.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run finance sync
        run: node scripts/sync-finance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Commit the corporate-actions record
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain lib/corporate-actions/*.json lib/screener-overrides.json)" ]; then
            echo "No corporate-action changes."
            exit 0
          fi
          git config user.name "corporate-actions-bot"
          git config user.email "corporate-actions-bot@users.noreply.github.com"
          git add lib/corporate-actions/*.json lib/screener-overrides.json
          git commit -m "Record corporate actions applied by the daily sync"
          git pull --rebase
          git push
